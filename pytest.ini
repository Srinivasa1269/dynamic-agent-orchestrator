# pytest settings.
# pythonpath = .  lets tests do "from app import config".
# testpaths = tests  tells pytest where our tests live.
# markers  names our own test labels. "live" tests call the real Claude.
# addopts  skips "live" tests by default. Run them with:  pytest -m live
[pytest]
pythonpath = .
testpaths = tests
markers =
    live: calls the real Claude API (costs money, needs a key)
addopts = -m "not live"
