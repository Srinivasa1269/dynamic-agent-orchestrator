# pytest settings.
# pythonpath = .  lets tests do "from app import config".
# testpaths = tests  tells pytest where our tests live.
# markers  names our own test labels. "live" tests call the real local model
#          (Ollama must be running) or the real web search (needs internet).
# addopts  skips "live" tests by default. Run them with:  pytest -m live
[pytest]
pythonpath = .
testpaths = tests
markers =
    live: calls the real Ollama model or the real web search (slow)
addopts = -m "not live"
